<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RESISTOR MATCH</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0f1a;color:#0ff;font-family:Orbitron;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:1rem}
h1{margin:1rem;text-shadow:0 0 12px #0ff}
.grid{display:grid;grid-template-columns:repeat(4,80px);gap:8px;margin:1rem}
.card{width:80px;height:80px;background:#112;border:2px solid #0ff5;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:1.4rem;cursor:pointer;transition:.2s}
.card.flipped,.card.matched{background:#0a2a2a;border-color:#0f8}
.card.matched{opacity:.6}
.hud{font-family:'Share Tech Mono';margin:.5rem}
</style>
</head>
<body>
<h1>RESISTOR MATCH</h1>
<div class="hud">Moves: <span id="m">0</span> | Matches: <span id="mt">0</span>/8</div>
<div class="grid" id="g"></div>
<script>
const vals=['10Ω','10Ω','22Ω','22Ω','47Ω','47Ω','100Ω','100Ω','220Ω','220Ω','1kΩ','1kΩ','4.7kΩ','4.7kΩ','10kΩ','10kΩ'];
vals.sort(()=>Math.random()-0.5);
let flips=[],moves=0,matches=0;
const g=document.getElementById('g');
vals.forEach((v,i)=>{
  const d=document.createElement('div');
  d.className='card';d.dataset.v=v;d.dataset.i=i;
  d.onclick=()=>{
    if(flips.length===2||d.classList.contains('flipped')||d.classList.contains('matched'))return;
    d.classList.add('flipped');d.textContent=v;flips.push(d);
    if(flips.length===2){
      moves++;document.getElementById('m').textContent=moves;
      if(flips[0].dataset.v===flips[1].dataset.v){
        flips.forEach(c=>c.classList.add('matched'));matches++;document.getElementById('mt').textContent=matches;
        flips=[];if(matches===8)alert('Complete! Moves: '+moves);
      }else{
        setTimeout(()=>{flips.forEach(c=>{c.classList.remove('flipped');c.textContent=''});flips=[]},700);
      }
    }
  };
  g.appendChild(d);
});
</script>
</body></html>
