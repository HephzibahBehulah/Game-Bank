services:
  api:
    build:
      context: ./backend
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////data/gamebank.db
    ports:
      - "8000:8000"
    volumes:
      - gamebank_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
volumes:
  gamebank_data: