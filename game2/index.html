<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CIRCUIT RUSH – Wire the Power</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>.hb-brand{display:flex;align-items:center;gap:9px;width:min(100%,520px);margin:10px auto 4px;padding:8px 12px;border:1px solid #55f5e533;border-radius:10px;background:#071522aa;text-decoration:none;color:#eafaff;font:800 11px/1.3 system-ui,Segoe UI,sans-serif;letter-spacing:.12em}.hb-brand img{width:170px;height:auto;max-height:50px;object-fit:contain}.hb-brand span{display:block}.hb-brand small{display:block;color:#a6becd;font-size:9px;letter-spacing:.18em}</style>
</head>
<body>
<a class="hb-brand" href="../" aria-label="Hephzibah Behulah Game Bank home"><img src="../assets/hb-logo.svg" alt="Hephzibah Behulah logo"><span>HEPHZIBAH BEHULAH™<small>GAME BANK · PLAY · LEARN</small></span></a>
  <div class="bg"></div>
  <header>
    <h1>CIRCUIT RUSH</h1>
    <p>Connect the power • Avoid short circuits</p>
  </header>

  <div class="hud">
    <div>Score: <span id="score">0</span></div>
    <div>Level: <span id="level">1</span></div>
    <div>Time: <span id="timer">30</span>s</div>
  </div>

  <div id="board" class="board"></div>

  <div class="controls">
    <button id="rotate-btn">Rotate Wire</button>
    <button id="check-btn">Check Circuit</button>
    <button id="next-btn" disabled>Next Level</button>
  </div>

  <div id="message" class="message"></div>

  <p id="level-score" class="message" role="status">Progress saves on this device.</p><script src="../assets/game-levels.js"></script><script src="script.js"></script>
</body>
</html>
